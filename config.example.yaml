pi:
  host: 192.168.1.10          # IP address of your Raspberry Pi / server
  ssh_user: ubuntu            # SSH username (default: ubuntu on Pi OS)
  # ssh_key: ~/.ssh/id_rsa   # optional — omit to use ssh-agent

network:
  subnet: 192.168.1.0/24      # Your local subnet for ping sweeps
  # Hosts to ping for internet connectivity checks (default: 1.1.1.1 — Cloudflare DNS).
  # Up to 5 entries; can be IPs or hostnames.
  connectivity_hosts:
    - 1.1.1.1   # Cloudflare DNS
    - 9.9.9.9   # Quad9 DNS
  # Optional: fallback DNS servers passed to the Docker container via --dns.
  # Used if your primary DNS resolver is unreachable. Up to 3 entries.
  # fallback_dns:
  #   - 8.8.8.8   # Google DNS
  #   - 8.8.4.4   # Google DNS secondary
  dormant_after_days: 3     # Days offline before a device is auto-marked dormant (shows moon icon, sorted last)
  skull_after_days: 7       # Days offline before a device shows a skull warning icon
  # vpn_interface: tun0     # Network interface for VPN speed/connectivity tests (Linux only).
  #                         # Leave commented out to disable VPN checks. Common values:
  #                         #   tun0  — OpenVPN (default)
  #                         #   wg0   — WireGuard
  #                         #   ppp0  — PPP / older VPN clients
  # Optional: assign devices to gateways so the map groups them under the correct router.
  # gateway_assignments:
  #   "192.168.1.1":
  #     - 192.168.1.100
  #     - 192.168.1.101

schedule:
  check_interval_minutes: 5             # Service check frequency: 1, 2, 5, 10, 15, 30, or 60
  internet_check_minutes: 5             # Internet connectivity check frequency (same options)
  internet_outage_check_seconds: 10     # Fast-poll interval (seconds) during an outage — min 5, max 300
  ping_interval_minutes: 5             # Ping sweep frequency (same options)
  speedtest_interval_hours: 4          # Direct speed test frequency: 1, 2, 3, 4, 6, 12, or 24
  vpn_speedtest_interval_hours: 4      # VPN speed test frequency (same options; 0 = disabled)
  speedtest_provider: ookla            # Speed test backend: cloudflare or ookla (preferred: ookla — selects best server by ping)
  threat_interval_hours: 6             # CVE / threat intelligence refresh frequency (same options)
  deep_scan_hour: 4                    # Hour (0-23) for the nightly deep port scan — e.g. 4 = 4:00 AM
  backup_interval_days: 0              # Auto-backup frequency in days (0 = disabled)
  backup_keep_days: 7                  # How many days of auto-backups to retain
  mtr_baseline_hours: 1                # MTR baseline run interval in hours (0 = disabled)
  mtr_outage_repeat_minutes: 15        # Re-run MTR every N minutes while an outage is active (0 = once only)

isp:
  name: "Your ISP Name"       # Your ISP name — shown in outage reports and exports
  connection_type: fibre      # Connection type: fibre / dsl / lte / cable / satellite
  expected_uptime: 100        # Expected uptime % — e.g. 100 for fibre, 99.9 for typical SLA
  plan_download_mbps: 250     # Advertised download speed (Mbps) — used for SLA compliance in speed reports
  plan_upload_mbps: 250       # Advertised upload speed (Mbps)
  account_number: ""          # Optional account / contract number for ISP correspondence
  support_email: ""           # Optional ISP support contact
  sla_url: ""                 # URL to your ISP's SLA document (shown in reports)
  sla_notes: ""               # Free-text SLA notes (shown in reports)

infra:
  name: ""                    # Your physical line/loop provider name (e.g. Openreach, Chorus)
  connection_type: fibre      # Line type: fibre / dsl / cable / lte / satellite / leased-line / other
  sla_pct: 0                  # Infra uptime target % — used for SLA comparison in reports (0 = disabled)
  plan_download_mbps: 0       # Link capacity down (Mbps)
  plan_upload_mbps: 0         # Link capacity up (Mbps)
  account_number: ""          # Optional contract / asset number
  support_email: ""           # Optional support contact
  sla_url: ""                 # URL to SLA or warranty document
  sla_notes: ""               # Free-text notes

threats:
  keywords:
    - docker
    - python flask
    - yt-dlp
    - transmission
    - jackett
    - nginx
    - sickgear
    - raspberry pi
  severity_threshold: medium   # low / medium / high / critical
