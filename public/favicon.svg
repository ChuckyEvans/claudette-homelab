<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12122a"/>
      <stop offset="100%" stop-color="#090916"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#c7d2fe"/>
      <stop offset="45%"  stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </radialGradient>
    <radialGradient id="blip" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Inner reference ring -->
  <circle cx="16" cy="16" r="6" fill="none" stroke="#4f46e5" stroke-width="0.8" opacity="0.35"/>

  <!-- Main C arc: radar bowl, opens to the right (60° gap each side) -->
  <!-- r=10, gap at ±60° from right: start (21, 7.34), end (21, 24.66) counterclockwise -->
  <path d="M21,7.3 A10,10 0 1,0 21,24.7"
        fill="none" stroke="#6366f1" stroke-width="3.2"
        stroke-linecap="round"/>

  <!-- Subtle highlight on top arm of C -->
  <path d="M21,7.3 A10,10 0 0,0 6,16"
        fill="none" stroke="#818cf8" stroke-width="3.2"
        stroke-linecap="round" opacity="0.35"/>

  <!-- Scan beam emitted into the gap -->
  <line x1="18.2" y1="16" x2="22.8" y2="16"
        stroke="#a5b4fc" stroke-width="1.6"
        stroke-linecap="round"/>

  <!-- Center emitter -->
  <circle cx="16" cy="16" r="2.6" fill="url(#core)"/>

  <!-- Detected blip — upper right between rings, slightly glowing -->
  <circle cx="21" cy="10.5" r="2"   fill="#4f46e5" opacity="0.5"/>
  <circle cx="21" cy="10.5" r="1.3" fill="url(#blip)"/>
</svg>
